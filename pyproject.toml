[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bulk-certificate-generator"
version = "0.1.0"
description = "Backend API for bulk certificate generation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.37,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_certificate_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
